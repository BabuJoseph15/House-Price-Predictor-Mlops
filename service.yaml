apiVersion: v1
kind: Service

metadata:
  name: house-price-service

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

spec:

  selector:
    app: house-price-api

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080

  type: NodePort
