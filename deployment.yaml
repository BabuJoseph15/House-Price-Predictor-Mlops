apiVersion: apps/v1
kind: Deployment

metadata:
  name: house-price-api
  labels:
    app: house-price-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: house-price-api

  template:
    metadata:
      labels:
        app: house-price-api

    spec:
      containers:
        - name: house-price-api

          image: babujoseph5757/house-price-api:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              value: ap-south-1

            - name: MLFLOW_TRACKING_URI
              value: "http://15.134.131.84:5000"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
