apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-api
  labels:
    app: house-price-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: house-price-api

  template:
    metadata:
      labels:
        app: house-price-api

    spec:
      containers:
        - name: house-price-api

          image: house-price-api:v4

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
